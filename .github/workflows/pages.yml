name: CI and Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - name: Shared contract files are identical
        run: node scripts/check-parity.mjs
      - name: Install
        run: |
          npm ci --prefix react
          npm ci --prefix vue
          npm ci --prefix e2e
      - name: Type-check and build
        run: |
          npm run build --prefix react
          npm run build --prefix vue
      - name: Unit tests (Vitest)
        run: |
          npm test --prefix react
          npm test --prefix vue
      - name: Install Playwright Chromium
        run: npx --prefix e2e playwright install --with-deps chromium
      - name: Shared e2e + parity suite (Playwright)
        run: npm test --prefix e2e
      - name: Assemble Pages site
        run: |
          mkdir -p _site/react _site/vue
          cp site/index.html _site/
          cp -r react/dist/. _site/react/
          cp -r vue/dist/. _site/vue/
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: _site
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
